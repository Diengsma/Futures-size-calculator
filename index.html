<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover" />
<title>Position Size Calculator</title>

<!-- PWA -->
<link rel="manifest" href="manifest.json" />
<meta name="theme-color" content="#0f2a3a" />

<!-- iOS home screen behavior -->
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="PosSize" />
<link rel="apple-touch-icon" href="icon-180.png" />

<style>
  :root {
    --bg: #0b1620;
    --surface: #16232e;
    --surface-2: #1c2b38;
    --accent: #2a9fb5;
    --accent-muted: rgba(42, 159, 181, 0.15);
    --text: #f2f6f8;
    --text-secondary: #8ba0ac;
    --border: #2a3a45;
    --radius: 14px;
  }

  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

  html, body {
    margin: 0;
    padding: 0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, sans-serif;
    height: 100%;
    overscroll-behavior-y: none;
  }

  body {
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: env(safe-area-inset-top, 20px) 20px calc(env(safe-area-inset-bottom, 20px) + 20px);
    min-height: 100vh;
  }

  header {
    width: 100%;
    max-width: 420px;
    padding: 16px 0 24px;
  }

  header h1 {
    font-size: 20px;
    font-weight: 600;
    margin: 0 0 4px;
  }

  header p {
    font-size: 13px;
    color: var(--text-secondary);
    margin: 0;
  }

  main {
    width: 100%;
    max-width: 420px;
    flex: 1;
  }

  .field {
    margin-bottom: 20px;
  }

  .field label {
    display: block;
    font-size: 13px;
    color: var(--text-secondary);
    margin-bottom: 8px;
  }

  .instrument-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 8px;
  }

  .instr-btn {
    padding: 14px 0;
    border-radius: 10px;
    border: 1.5px solid var(--border);
    background: var(--surface);
    color: var(--text);
    font-size: 15px;
    font-weight: 500;
    font-family: inherit;
    cursor: pointer;
    transition: all 0.15s ease;
  }

  .instr-btn.active {
    border-color: var(--accent);
    background: var(--accent-muted);
    color: var(--accent);
  }

  input[type="number"] {
    width: 100%;
    padding: 14px 16px;
    border-radius: 10px;
    border: 1.5px solid var(--border);
    background: var(--surface);
    color: var(--text);
    font-size: 17px;
    font-family: inherit;
    outline: none;
  }

  input[type="number"]:focus {
    border-color: var(--accent);
  }

  .results {
    margin-top: 8px;
  }

  .results-row {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
    margin-bottom: 10px;
  }

  .stat-card {
    background: var(--surface);
    border-radius: var(--radius);
    padding: 14px 16px;
  }

  .stat-card p:first-child {
    font-size: 12px;
    color: var(--text-secondary);
    margin: 0 0 6px;
  }

  .stat-card p:last-child {
    font-size: 19px;
    font-weight: 600;
    margin: 0;
  }

  .highlight-card {
    background: var(--accent-muted);
    border: 1.5px solid var(--accent);
    border-radius: var(--radius);
    padding: 18px 16px;
    text-align: left;
  }

  .highlight-card p:first-child {
    font-size: 13px;
    color: var(--accent);
    margin: 0 0 6px;
  }

  .highlight-card p:last-child {
    font-size: 34px;
    font-weight: 700;
    margin: 0;
    color: var(--accent);
  }

  .note {
    font-size: 12px;
    color: var(--text-secondary);
    margin-top: 14px;
    line-height: 1.5;
  }

  footer {
    width: 100%;
    max-width: 420px;
    text-align: center;
    padding-top: 24px;
  }

  footer p {
    font-size: 11px;
    color: var(--text-secondary);
    margin: 0;
  }
</style>
</head>
<body>

<header>
  <h1>Position Size Calculator</h1>
  <p>Futures — MES, MNQ, MGC</p>
</header>

<main>
  <div class="field">
    <label>Contrat</label>
    <div class="instrument-grid">
      <button class="instr-btn" data-instr="MES">MES</button>
      <button class="instr-btn" data-instr="MNQ">MNQ</button>
      <button class="instr-btn" data-instr="MGC">MGC</button>
    </div>
  </div>

  <div class="field">
    <label>Stop loss (ticks)</label>
    <input id="ticks" type="number" inputmode="decimal" value="50" min="1" step="1" />
  </div>

  <div class="field">
    <label>Risque ($)</label>
    <input id="risk" type="number" inputmode="decimal" value="1000" min="1" step="10" />
  </div>

  <div class="results">
    <div class="results-row">
      <div class="stat-card">
        <p>Valeur du tick</p>
        <p id="out-tickval">—</p>
      </div>
      <div class="stat-card">
        <p>Risque / contrat</p>
        <p id="out-riskpc">—</p>
      </div>
    </div>

    <div class="highlight-card">
      <p>Contrats à utiliser</p>
      <p id="out-contracts">—</p>
    </div>

    <p class="note" id="note"></p>
  </div>
</main>

<footer>
  <p>Valeurs de tick fixes CME — vérifie toujours les specs à jour</p>
</footer>

<script>
  const specs = {
    MES: { tick: 0.25, tickValue: 1.25 },
    MNQ: { tick: 0.25, tickValue: 0.50 },
    MGC: { tick: 0.10, tickValue: 1.00 }
  };

  let current = "MES";

  const buttons = document.querySelectorAll(".instr-btn");
  const ticksInput = document.getElementById("ticks");
  const riskInput = document.getElementById("risk");
  const outTickVal = document.getElementById("out-tickval");
  const outRiskPc = document.getElementById("out-riskpc");
  const outContracts = document.getElementById("out-contracts");
  const note = document.getElementById("note");

  function fmt(n, decimals) {
    return n.toFixed(decimals).replace(".", ",");
  }

  function selectInstrument(name) {
    current = name;
    buttons.forEach((btn) => {
      btn.classList.toggle("active", btn.dataset.instr === name);
    });
    recalc();
  }

  function recalc() {
    const spec = specs[current];
    const ticks = parseFloat(ticksInput.value) || 0;
    const risk = parseFloat(riskInput.value) || 0;
    const riskPerContract = ticks * spec.tickValue;
    const contracts = riskPerContract > 0 ? Math.floor(risk / riskPerContract) : 0;
    const actualRisk = contracts * riskPerContract;

    outTickVal.textContent = fmt(spec.tickValue, spec.tickValue < 1 ? 3 : 2) + " $";
    outRiskPc.textContent = fmt(riskPerContract, 2) + " $";
    outContracts.textContent = contracts;

    note.textContent = contracts > 0
      ? `Avec ${contracts} contrat(s), le risque réel est de ${fmt(actualRisk, 2)} $ (au lieu de ${fmt(risk, 2)} $ demandé).`
      : "Augmente le risque ou réduis le stop loss pour obtenir au moins 1 contrat.";
  }

  buttons.forEach((btn) => {
    btn.addEventListener("click", () => selectInstrument(btn.dataset.instr));
  });
  ticksInput.addEventListener("input", recalc);
  riskInput.addEventListener("input", recalc);

  selectInstrument("MES");

  // Register service worker for offline support
  if ("serviceWorker" in navigator) {
    window.addEventListener("load", () => {
      navigator.serviceWorker.register("./service-worker.js").catch(() => {});
    });
  }
</script>

</body>
</html>
